name: Swift debug

# Temporary workflow to investigate why SourceKit's XPC service crashes on Darwin.

on:
  workflow_dispatch:
    inputs:
      reuse-run-id:
        description: ID of a previous run whose built paths are used
        required: true
        type: string

permissions:
  actions: read
  contents: read

defaults:
  run:
    shell: bash

jobs:
  debug:
    strategy:
      fail-fast: false
      matrix:
        toolchain: [current, base]
    name: ${{ matrix.toolchain }}
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        if: matrix.toolchain == 'base'
        with:
          persist-credentials: false
          ref: 5b7b3c13565cb640271e7fb98bade814bc754169
          path: base

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: matrix.toolchain == 'current'
        with:
          pattern: nix-store-darwin-*
          path: ${{ runner.temp }}/nix-store-in
          merge-multiple: true
          run-id: ${{ inputs.reuse-run-id }}
          github-token: ${{ github.token }}

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            require-sigs = false

      - name: Import
        if: matrix.toolchain == 'current'
        run: |
          shopt -s nullglob
          for export in "$RUNNER_TEMP"/nix-store-in/*.nar; do
            references=$(cat "${export%.nar}.references")
            if [ -n "$references" ]; then
              # shellcheck disable=SC2086
              nix-store --realise $references > /dev/null
            fi
            nix-store --import < "$export" > /dev/null
          done

      - name: Inspect SourceKit
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          # `timeout` is not available on macOS.
          timeout() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          repo=$GITHUB_WORKSPACE
          if [ "$TOOLCHAIN" = base ]; then repo=$GITHUB_WORKSPACE/base; fi
          swift=$(nix-build "$repo" -A swiftPackages.swift --no-out-link)
          echo "swift: $swift"
          framework="$swift/lib/sourcekitd.framework"
          ls -la "$framework/" "$framework/Versions/A/" || true
          service="$framework/Versions/A/XPCServices/SourceKitService.xpc/Contents/MacOS/SourceKitService"
          otool -L "$service" || true
          otool -l "$service" | grep -A2 LC_RPATH || true
          otool -L "$framework/Versions/A/sourcekitd" || true
          cat "$framework/Versions/A/XPCServices/SourceKitService.xpc/Contents/Info.plist" || true
          echo "Running the service directly:"
          ls -laR "$framework/Versions/A/XPCServices"
          timeout 10 "$service" 2>&1 | tail -20 || echo "exit code $?"
          DYLD_PRINT_LIBRARIES=1 timeout 10 "$service" 2>&1 | tail -40 || echo "exit code $?"

      - name: Run the SourceKit-LSP test
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          # `timeout` is not available on macOS.
          timeout() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          repo=$GITHUB_WORKSPACE
          if [ "$TOOLCHAIN" = base ]; then repo=$GITHUB_WORKSPACE/base; fi
          test=$GITHUB_WORKSPACE/pkgs/development/compilers/swift/by-name/so/sourcekit-lsp/tests/semantic-functionality
          cp -R "$test/src" "$RUNNER_TEMP/project"
          chmod -R u+w "$RUNNER_TEMP/project"
          NIX_PATH=nixpkgs=$repo timeout 900 nix-shell -p \
            "with import $repo {}; [ swiftPackages.swift swiftPackages.swiftpm swiftPackages.sourcekit-lsp python3 ]" \
            --run "cd '$RUNNER_TEMP/project' && python3 '$test/test.py' ." 2>&1 | grep -v "pinging service" | tail -40 || true

      - name: Crash reports
        if: always()
        run: |
          for f in ~/Library/Logs/DiagnosticReports/*SourceKit* /Library/Logs/DiagnosticReports/*SourceKit*; do
            [ -e "$f" ] || continue
            echo "=== $f"
            cat "$f"
            echo
          done
          log show --last 30m --predicate 'process == "SourceKitService" OR eventMessage CONTAINS "SourceKitService"' \
            --style compact 2>/dev/null | tail -60 || true
